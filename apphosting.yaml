# Settings for Cloud Run
runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables and secrets
env:
  - variable: GEMINI_MODEL
    value: gemini-3.6-flash
  - variable: ENABLE_HSTS
    value: "true"
  - variable: NODE_ENV
    value: "production"
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
